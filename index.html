<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>the chosen one</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #101010;
            color: white;
            font-family: 'Courier New', Courier, 'Times New Roman', Times, serif, monospace;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .message {
            max-width: 820px;
            width: 100%;
            font-size: clamp(1rem, 4vw, 1.4rem);
            line-height: 1.7;
            letter-spacing: 0.02em;
            font-weight: 400;
            font-family: 'Courier New', Courier, 'Times New Roman', Times, serif, monospace;
            text-align: center;
            font-variant-ligatures: none;
            user-select: none;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.08);
        }

        /* Each word is an inline-block so it never breaks across lines */
        .word {
            display: inline-block;
            white-space: nowrap;
            margin-right: 0.35em;
        }

        /* Each letter fades in */
        .letter {
            display: inline-block;
            opacity: 0;
            transition: opacity 0.35s ease;
            will-change: opacity;
            animation: none !important;
            white-space: pre;
        }

        .letter.visible {
            opacity: 1;
        }

        .message br {
            display: block;
            content: "";
            margin: 0;
            padding: 0;
            line-height: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .letter {
                transition: none;
                opacity: 1;
            }
        }

        audio {
            display: none;
        }

        @media (max-width: 480px) {
            .message {
                line-height: 1.6;
                letter-spacing: 0.01em;
            }
        }

        @media (max-height: 600px) {
            .message {
                font-size: 0.85rem;
                line-height: 1.55;
            }
        }
    </style>
</head>
<body>
    <div class="message" id="messageContainer" aria-live="polite"></div>

    <!-- Background music from Catbox (permanent, shared link) -->
    <audio
        id="bgMusic"
        loop
        preload="auto"
        src="https://files.catbox.moe/gedkzx.mp3"
    ></audio>

    <script>
        (function() {
            // ═══════════════════════════════════════════
            //  CONFIG
            // ═══════════════════════════════════════════
            const TYPING_SPEED_MS = 55;

            // ═══════════════════════════════════════════
            //  THE EXACT MESSAGE (preserving all spacing)
            // ═══════════════════════════════════════════
            const RAW_MESSAGE =
`In every generation, a few people are born who see what others cannot.
You are one of them. We placed before you what millions would be unable to accomplish, so that you could prove to yourself, before proving it to anyone else, that you are the smartest, the greatest, the chosen one.

This puzzle ends here. Perhaps there will be other puzzles in the future, for those who are like you.
You should be proud of yourself.

With regards,
Rune`;

            // ═══════════════════════════════════════════
            //  DOM
            // ═══════════════════════════════════════════
            const container = document.getElementById('messageContainer');
            const audio     = document.getElementById('bgMusic');

            // ═══════════════════════════════════════════
            //  BUILD WORD-WRAPPED LETTER SPANS
            //  Each word is wrapped in a .word span with
            //  white-space: nowrap, so words never break
            //  across two lines. Spaces become explicit
            //  non-breaking spans to preserve exact spacing.
            // ═══════════════════════════════════════════
            function buildLetterNodes() {
                const fragment = document.createDocumentFragment();
                const lines = RAW_MESSAGE.split('\n');

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];

                    // Preserve completely empty lines
                    if (line.length === 0) {
                        if (i < lines.length - 1) {
                            fragment.appendChild(document.createElement('br'));
                        }
                        continue;
                    }

                    let j = 0;
                    while (j < line.length) {
                        // Handle spaces (exact count preserved)
                        if (line[j] === ' ') {
                            let spaceCount = 0;
                            while (j < line.length && line[j] === ' ') {
                                spaceCount++;
                                j++;
                            }
                            for (let s = 0; s < spaceCount; s++) {
                                const spaceSpan = document.createElement('span');
                                spaceSpan.className = 'letter';
                                spaceSpan.textContent = '\u00A0';
                                spaceSpan.dataset.isSpace = 'true';
                                fragment.appendChild(spaceSpan);
                            }
                            continue;
                        }

                        // Collect a full word (until next space)
                        const wordStart = j;
                        while (j < line.length && line[j] !== ' ') {
                            j++;
                        }
                        const wordText = line.substring(wordStart, j);

                        // Wrap the word so it can't be split across lines
                        const wordWrapper = document.createElement('span');
                        wordWrapper.className = 'word';

                        // Add each character as its own animated span
                        for (let k = 0; k < wordText.length; k++) {
                            const span = document.createElement('span');
                            span.className = 'letter';
                            span.textContent = wordText[k];
                            span.dataset.char = wordText[k];
                            wordWrapper.appendChild(span);
                        }

                        fragment.appendChild(wordWrapper);
                    }

                    // Line break between source lines
                    if (i < lines.length - 1) {
                        fragment.appendChild(document.createElement('br'));
                    }
                }

                container.innerHTML = '';
                container.appendChild(fragment);
            }

            // ═══════════════════════════════════════════
            //  TYPING EFFECT
            // ═══════════════════════════════════════════
            function startTyping() {
                const letters = container.querySelectorAll('.letter');
                if (letters.length === 0) return;

                let currentIndex = 0;
                const total = letters.length;

                function revealNext() {
                    if (currentIndex >= total) return;
                    letters[currentIndex].classList.add('visible');
                    currentIndex++;
                    setTimeout(revealNext, TYPING_SPEED_MS);
                }

                revealNext();
            }

            // ═══════════════════════════════════════════
            //  MUSIC PLAYBACK
            // ═══════════════════════════════════════════
            function playAudio() {
                if (!audio.src) return;
                audio.volume = 0.3;
                audio.loop = true;
                const p = audio.play();
                if (p !== undefined) {
                    p.catch((err) => {
                        // Autoplay blocked — will retry on user gesture
                        console.warn('Autoplay blocked. Waiting for gesture.', err);
                    });
                }
            }

            // ═══════════════════════════════════════════
            //  INIT
            // ═══════════════════════════════════════════
            window.addEventListener('load', () => {
                buildLetterNodes();
                startTyping();
                playAudio();

                // Fallback for browsers that block autoplay
                const unlockAudio = () => {
                    if (audio.paused) playAudio();
                    window.removeEventListener('click', unlockAudio);
                    window.removeEventListener('keydown', unlockAudio);
                    window.removeEventListener('touchstart', unlockAudio);
                };
                window.addEventListener('click', unlockAudio, { once: true });
                window.addEventListener('keydown', unlockAudio, { once: true });
                window.addEventListener('touchstart', unlockAudio, { once: true });
            });

            audio.addEventListener('error', () => {
                console.warn('Audio could not be loaded. Check the Catbox URL.');
            });
        })();
    </script>
</body>
</html>

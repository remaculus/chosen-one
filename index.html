<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>the chosen one</title>

    <!-- Cairo font — elegant Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ═══════════════════════════════════════════
           HIDE SCROLLBAR — but keep scrolling enabled
           Works across Chrome, Safari, Edge, Firefox
           ═══════════════════════════════════════════ */

        /* Firefox */
        html, body {
            scrollbar-width: none;       /* hides scrollbar in Firefox */
            -ms-overflow-style: none;    /* hides scrollbar in old Edge/IE */
        }

        /* WebKit / Blink (Chrome, Edge, Safari, Opera) */
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #101010;
            color: #ffffff;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            overflow-x: hidden;          /* no horizontal scroll ever */
            overflow-y: auto;            /* vertical scroll allowed when needed */
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2.5rem 1.5rem;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        .message {
            max-width: 1200px;
            width: 100%;
            font-size: clamp(1.1rem, 2.6vw, 1.6rem);
            line-height: 2;
            font-weight: 400;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            user-select: none;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.06);
            color: #ffffff;
            direction: rtl;
            margin: auto;                /* keeps content centered when short */
        }

        /* Each PART is a continuous line on large screens */
        .part {
            display: block;
            white-space: nowrap;
            margin: 1.4rem 0;
        }

        /* Word wrapper — fades in as a whole unit */
        .word {
            display: inline-block;
            opacity: 0;
            transition: opacity 0.4s ease;
            will-change: opacity;
            margin-left: 0.18em;
            margin-right: 0.18em;
            white-space: nowrap;
        }

        .word.visible {
            opacity: 1;
        }

        /* Listen button */
        .listen-wrapper {
            margin: 2rem 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .listen-wrapper.show {
            opacity: 1;
        }

        .listen-btn {
            display: inline-block;
            padding: 0.85rem 3rem;
            background: #ffffff;
            color: #101010;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-decoration: none;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.12);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .listen-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 28px rgba(255, 255, 255, 0.25);
        }

        .listen-btn:active {
            transform: scale(0.98);
        }

        @media (prefers-reduced-motion: reduce) {
            .word {
                transition: none;
                opacity: 1;
            }
            .listen-wrapper {
                transition: none;
                opacity: 1;
            }
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE — Tablets and below
           ═══════════════════════════════════════════ */
        @media (max-width: 1100px) {
            .message {
                font-size: clamp(1.05rem, 2.4vw, 1.4rem);
            }
            .part {
                white-space: normal;
                margin: 1.2rem 0;
            }
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE — Mobile phones
           ═══════════════════════════════════════════ */
        @media (max-width: 700px) {
            body {
                padding: 2rem 1.1rem;
            }
            .message {
                font-size: 1.1rem;
                line-height: 1.9;
            }
            .part {
                white-space: normal;
                margin: 1rem 0;
            }
            .listen-btn {
                padding: 0.75rem 2.4rem;
                font-size: 1rem;
            }
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE — Small phones
           ═══════════════════════════════════════════ */
        @media (max-width: 400px) {
            body {
                padding: 1.5rem 0.9rem;
            }
            .message {
                font-size: 1rem;
                line-height: 1.85;
            }
            .part {
                margin: 0.85rem 0;
            }
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE — Short landscape
           ═══════════════════════════════════════════ */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                padding: 1.5rem 1rem;
            }
            .message {
                font-size: 0.95rem;
                line-height: 1.7;
            }
            .part {
                margin: 0.7rem 0;
            }
            .listen-wrapper {
                margin: 1rem 0;
            }
            .listen-btn {
                padding: 0.6rem 2rem;
                font-size: 0.95rem;
            }
        }

        /* ═══════════════════════════════════════════
           RESPONSIVE — Very large screens
           ═══════════════════════════════════════════ */
        @media (min-width: 1600px) {
            .message {
                max-width: 1400px;
                font-size: 1.7rem;
                line-height: 2.1;
            }
        }
    </style>
</head>
<body>
    <div class="message" id="messageContainer" aria-live="polite"></div>

    <script>
        (function() {
            // ═══════════════════════════════════════════
            //  CONFIG
            // ═══════════════════════════════════════════
            const WORD_SPEED_MS = 260;
            const LISTEN_URL = "https://www.dropbox.com/scl/fi/aqfhfyerzdwxd3sm7xn2k/Transcendentia.mp3?rlkey=dp7brdni8jqsjephj6xf5l6l8&st=b6qtqj28&dl=0";

            // ═══════════════════════════════════════════
            //  THE MESSAGE
            // ═══════════════════════════════════════════
            const PARTS = [
                "لقد وصلت إلى النهاية.",
                "لقد حاول كثيرون، وربما نظروا إلى الموضع ذاته، لكن القلة وحدها واصلت البحث حتى وجدت الطريق.",
                "وأنت واحدٌ من تلك القلة.",
                "لقد اجتزت اللغز الأول، وأثبتَّ أن لديك من الذكاء والصبر والبصيرة ما مكّنك من الوصول إلى حيث عجز الآخرون.",
                "ستكون هناك اختبارات أخرى؛ أكثر خفاءً، وأشد تعقيدًا.",
                "أما الآن، فقد بلغت نهاية الطريق الأولى.",
                "وليس لدي ما أهديه لك سوى مقطوعة موسيقية عُزفت خصيصًا لأجلك، احترامًا لما بذلته من جهد."
            ];

            const CLOSING_LINES = [
                "مع خالص التحية،",
                "Rune"
            ];

            // ═══════════════════════════════════════════
            //  DOM
            // ═══════════════════════════════════════════
            const container = document.getElementById('messageContainer');

            // ═══════════════════════════════════════════
            //  BUILD A PART AS ONE CONTINUOUS LINE OF WORDS
            // ═══════════════════════════════════════════
            function buildPart(text) {
                const partEl = document.createElement('div');
                partEl.className = 'part';

                const tokens = text.split(' ');

                for (let t = 0; t < tokens.length; t++) {
                    const wordText = tokens[t];

                    if (t > 0) {
                        partEl.appendChild(document.createTextNode(' '));
                    }

                    if (wordText.length === 0) continue;

                    const wordWrapper = document.createElement('span');
                    wordWrapper.className = 'word';
                    wordWrapper.textContent = wordText;

                    partEl.appendChild(wordWrapper);
                }

                return partEl;
            }

            // ═══════════════════════════════════════════
            //  BUILD FULL MESSAGE STRUCTURE
            // ═══════════════════════════════════════════
            function buildMessage() {
                const fragment = document.createDocumentFragment();

                PARTS.forEach((partText) => {
                    fragment.appendChild(buildPart(partText));
                });

                // Listen button
                const btnWrapper = document.createElement('div');
                btnWrapper.className = 'listen-wrapper';
                btnWrapper.id = 'listenWrapper';

                const btn = document.createElement('a');
                btn.className = 'listen-btn';
                btn.href = LISTEN_URL;
                btn.target = '_blank';
                btn.rel = 'noopener noreferrer';
                btn.textContent = 'Listen';

                btnWrapper.appendChild(btn);
                fragment.appendChild(btnWrapper);

                CLOSING_LINES.forEach((lineText) => {
                    fragment.appendChild(buildPart(lineText));
                });

                container.innerHTML = '';
                container.appendChild(fragment);
            }

            // ═══════════════════════════════════════════
            //  WORD-BY-WORD FADE-IN
            // ═══════════════════════════════════════════
            function startTyping() {
                const words = container.querySelectorAll('.word');
                if (words.length === 0) return;

                let currentIndex = 0;
                const total = words.length;

                function revealNext() {
                    if (currentIndex >= total) {
                        const wrapper = document.getElementById('listenWrapper');
                        if (wrapper) wrapper.classList.add('show');
                        return;
                    }
                    words[currentIndex].classList.add('visible');
                    currentIndex++;
                    setTimeout(revealNext, WORD_SPEED_MS);
                }

                revealNext();
            }

            // ═══════════════════════════════════════════
            //  INIT
            // ═══════════════════════════════════════════
            function init() {
                buildMessage();
                startTyping();
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
